apiVersion: 1

datasources:
  - name: Postgres
    type: postgres
    access: proxy
    url: ${GF_DATASOURCE_POSTGRES_HOST}:5432
    database: ${GF_DATASOURCE_POSTGRES_DB}
    user: ${GF_DATASOURCE_POSTGRES_USER}
    secureJsonData:
      password: ${GF_DATASOURCE_POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
    isDefault: true
    editable: false
